<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico
    " />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCD Status Map</title>
</head>

<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <img src="/src/assets/logo.png" alt="RCD Logo" class="brand-logo" />
        <div class="brand-text">
          <h1>RCD Status Map</h1>
          <span id="role-badge" class="badge badge-viewer">Viewer View</span>
        </div>
      </div>

      <nav class="nav-tabs" id="nav-tabs">
        <button type="button" id="nav-map-btn" class="nav-tab on">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          Map
        </button>
        <button type="button" id="nav-users-btn" class="nav-tab admin-only" style="display: none;">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Manage Users
        </button>
      </nav>

      <div class="user-profile-bar">
        <div id="user-info-capsule" class="user-capsule" style="display: none;">
          <span class="user-dot"></span>
          <span id="user-email-display" class="user-email-text"></span>
        </div>
        <button id="auth-btn">Sign In</button>
      </div>
    </div>

    <div class="header-controls" id="header-controls">
      <select id="mp" aria-label="Select subdivision project"></select>
      <div class="g" id="chips"></div>
      <div class="g" id="edit-tools">
        <button data-m="fill" class="on">Paint lot</button>
        <button data-m="pin">Pin</button>
        <button data-m="erase">Erase</button>
        <button data-m="lg">Move legend</button>
      </div>
      <div class="g" id="action-tools">
        <button id="un" title="Undo">Undo</button>
        <button id="cl" title="Clear all">Clear all</button>
        <button id="zo" title="-">−</button>
        <button id="zi" title="+">+</button>
        <button id="zf" title="Fit">Fit</button>
        <button id="png" title="Export PNG">Save PNG</button>
      </div>
    </div>
    <small id="status-hint">Viewer View: Live lot updates · drag to pan</small>
  </header>
  <main id="stage">
    <div id="box">
      <canvas id="base"></canvas>
      <canvas id="fill"></canvas>
      <canvas id="pins"></canvas>
      <div id="ld">Loading map…</div>
    </div>
  </main>
  <div id="users-view" style="display: none;"></div>
  <div id="t"></div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <img src="/src/assets/logo.png" alt="RCD Logo" class="modal-logo" />
        <h2 id="auth-title">Sign In</h2>
        <p id="auth-subtitle" class="modal-sub">Sign in to access your account or editor tools</p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tab-signin" class="auth-tab on">Sign In</button>
        <button type="button" id="tab-signup" class="auth-tab">Sign Up</button>
      </div>

      <div id="auth-error" class="auth-error"></div>
      <div id="auth-success" class="auth-success"></div>

      <form id="auth-form" class="modal-form">
        <input type="email" id="auth-email" placeholder="Email address" required autocomplete="email" />
        <input type="password" id="auth-password" placeholder="Password (min 6 characters)" required
          autocomplete="current-password" minlength="6" />
        <div class="modal-actions">
          <button type="button" id="auth-cancel">Browse as Guest</button>
          <button type="submit" id="auth-submit-btn" class="on">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
