name: Supabase Keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Required repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are missing."
            exit 1
          fi

          if ! http_code=$(curl --silent --show-error --fail \
            --max-time 30 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/projects?select=id&limit=1"); then
            exit 1
          fi

          case "$http_code" in
            2??) echo "Supabase keepalive succeeded (HTTP $http_code)." ;;
            *) echo "Supabase keepalive received non-OK HTTP $http_code."; exit 1 ;;
          esac
